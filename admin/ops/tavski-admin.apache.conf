# Included INSIDE the existing HTTPS VirtualHost dev3.memogadget.com only.
# Replaces the previous /tavski/ ProxyPass, Alias and assets Directory block.
<Directory "/home/www/dev3.memogadget.com/public_html/tavski">
    DirectoryIndex index.html
    Options -Indexes
    Require all granted
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</Directory>

<DirectoryMatch "^/home/www/dev3[.]memogadget[.]com/public_html/tavski/[.]">
    Require all denied
</DirectoryMatch>

# Never serve source files, .env, node_modules or private build output as files.
<Directory "/home/www/dev3.memogadget.com/public_html/tavski/admin">
    AllowOverride None
    Require all denied
</Directory>

RedirectMatch 302 "^/tavski/admin$" "/tavski/admin/"
ProxyPass "/tavski/admin/assets/" "!"
Alias "/tavski/admin/assets/" "/home/www/dev3.memogadget.com/public_html/tavski/admin/.output/public/assets/"
<Directory "/home/www/dev3.memogadget.com/public_html/tavski/admin/.output/public/assets">
    AllowOverride None
    Options -Indexes
    Require all granted
</Directory>
ProxyPass "/tavski/admin/" "http://127.0.0.1:3103/tavski/admin/"
ProxyPassReverse "/tavski/admin/" "http://127.0.0.1:3103/tavski/admin/"
